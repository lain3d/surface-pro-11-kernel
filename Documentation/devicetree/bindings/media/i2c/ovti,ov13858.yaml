%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov13858.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Omnivision OV13858 CMOS Sensor

maintainers:
  - Sakari Ailus <sakari.ailus@linux.intel.com>

description:
  The Omnivision OV13858 is a 13 megapixel CMOS image sensor with a 4-lane
  MIPI CSI-2 interface, supporting 4224x3136 at 1080 Mbps/lane and a binned
  2112x1568 mode at 540 Mbps/lane. It requires a 19.2 MHz external clock.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: ovti,ov13858

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description: External clock (XVCLK), 19.2 MHz.

  avdd-supply:
    description: Analogue circuit voltage supply.

  dovdd-supply:
    description: I/O circuit voltage supply.

  dvdd-supply:
    description: Digital circuit voltage supply.

  reset-gpios:
    description: Active low GPIO connected to the XSHUTDOWN pad of the sensor.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        additionalProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4
          link-frequencies: true
          remote-endpoint: true

        required:
          - data-lanes
          - link-frequencies
          - remote-endpoint

required:
  - compatible
  - reg
  - clocks
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "ovti,ov13858";
            reg = <0x10>;

            reset-gpios = <&tlmm 110 GPIO_ACTIVE_LOW>;
            pinctrl-names = "default";
            pinctrl-0 = <&cam_rear_default>;

            clocks = <&ov13858_clk>;
            assigned-clocks = <&ov13858_clk>;
            assigned-clock-rates = <19200000>;

            avdd-supply = <&vreg_l5m_2p8>;
            dovdd-supply = <&vreg_l6m_1p8>;
            dvdd-supply = <&vreg_l1m_1p2>;

            orientation = <0>;

            port {
                ov13858_ep: endpoint {
                    remote-endpoint = <&csiphy_ep>;
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <540000000 270000000>;
                };
            };
        };
    };
...
