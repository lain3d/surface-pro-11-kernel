%YAML 1.2
---
$id: http://devicetree.org/schemas/thunderbolt/qcom,x1e80100-usb4.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm X1E80100 USB4 Host Router

maintainers:
  - Linux USB Mailing List <linux-usb@vger.kernel.org>

description:
  A USB4 host router on the Qualcomm X1E80100. The register interface is the
  one the USB4 specification defines for the host interface, so the driver is
  the generic one; only the enumeration differs from a PCIe-attached router.
  Firmware describes the same blocks through ACPI as ACPI0015 devices.

properties:
  compatible:
    const: qcom,x1e80100-usb4

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: host interface (NHI) interrupt
      - description: wake interrupt
      - description: misc/status interrupt

  interrupt-names:
    items:
      - const: nhi
      - const: wake
      - const: misc

  clocks:
    items:
      - description: master clock
      - description: configuration AHB clock
      - description: system clock
      - description: time management unit clock
      - description: sideband interface clock

  clock-names:
    items:
      - const: master
      - const: cfg_ahb
      - const: sys
      - const: tmu
      - const: sb_if

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        usb4@1563f000 {
            compatible = "qcom,x1e80100-usb4";
            reg = <0 0x1563f000 0 0x000c0000>;

            interrupts = <GIC_SPI 472 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 255 IRQ_TYPE_EDGE_RISING>,
                         <GIC_SPI 579 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "nhi",
                              "wake",
                              "misc";

            clocks = <&gcc 299>,
                     <&gcc 296>,
                     <&gcc 309>,
                     <&gcc 310>,
                     <&gcc 307>;
            clock-names = "master",
                          "cfg_ahb",
                          "sys",
                          "tmu",
                          "sb_if";
        };
    };
...
